    <title>Withdrawal Support - Parimatch</title>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

        body {
            background-color: #0b0b0b;

            flex-direction: column;

            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-top: 6px;
        }

        .back-btn {

            color: #000;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            border: none;
        }

        .brand-pill {
            display: inline-flex;
            align-items: center;

            padding: 6px 16px;

            gap: 8px;
        }

        .parimatch-badge {

            color: #000;
            font-weight: 900;
            font-style: italic;
            padding: 2px 8px;
            border-radius: 4px;

            letter-spacing: -0.5px;
        }

        .support-text {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
        }

        /* Form Container */
        .form-container {
            background-color: #121212;
            border: 1.5px solid #d4ff00;
            border-radius: 20px;
            padding: 20px 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

            color: #fff;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

            color: #9ca3af;
            margin-bottom: 16px;
        }
